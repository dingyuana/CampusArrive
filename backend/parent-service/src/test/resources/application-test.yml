server:
  port: 0

spring:
  application:
    name: parent-service
  main:
    allow-bean-definition-overriding: true
  jackson:
    property-naming-strategy: SNAKE_CASE

parent:
  jwt-secret: campus-arrive-parent-jwt-secret-key-2026-hs256-signing
  jwt-issuer: freshman-checkin-system
  jwt-audience: parent-h5
  jwt-expiry-seconds: 2592000
  code-length: 6
  code-expiry-seconds: 300
  max-error-count: 5
  lock-duration-seconds: 1800
  rate-limit-window-seconds: 60
  rate-limit-max-requests: 1
